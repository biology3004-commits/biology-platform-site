<rect width="1240" height="1754" fill="#FAFAFA"/><rect width="1240" height="14" fill="#C8102E"/><rect y="1740" width="1240" height="14" fill="#009A44"/><text x="1190" y="98" font-size="62" font-weight="900" fill="#C8102E" text-anchor="end">فتح الثغور وإغلاقها</text><text x="1190" y="146" font-size="26" font-weight="700" fill="#1F2937" text-anchor="end">الوحدة الرابعة: الاتزان الداخلي  •  الدرس ٤-٥: الاتزان الداخلي في النباتات</text><rect x="50" y="52" width="250" height="84" rx="14" fill="#E6F7EE" stroke="#009A44" stroke-width="2"/><text x="175" y="88" font-size="20" font-weight="800" fill="#0A4D2E" text-anchor="middle">أحياء الصف الثاني عشر</text><text x="175" y="118" font-size="20" font-weight="700" fill="#0A4D2E" text-anchor="middle">الفصل الدراسي الأوَّل</text><line x1="50" y1="172" x2="1190" y2="172" stroke="#C9A961" stroke-width="3"/><text x="1190" y="216" font-size="28" font-weight="800" fill="#1F2937" text-anchor="end">تُوازن فتحة الثغر بين حاجتين متعارضتين:</text><rect x="643" y="236" width="547" height="104" rx="18" fill="#FEE9EC" stroke="#C8102E" stroke-width="2.5"/><circle cx="1144" cy="288" r="28" fill="#C8102E"/><text x="1144" y="297" font-size="28" font-weight="900" fill="#fff" text-anchor="middle">١</text><text x="1102" y="280" font-size="22" font-weight="900" fill="#C8102E" text-anchor="end">امتصاص ثاني أكسيد الكربون</text><text x="1102" y="318" font-size="20" font-weight="600" fill="#1F2937" text-anchor="end">بالانتشار لعمليَّة التمثيل الضوئي</text><path d="M639,288 L609,288" stroke="#C9A961" stroke-width="4" marker-end="url(#ah)"/><rect x="50" y="236" width="547" height="104" rx="18" fill="#FEE9EC" stroke="#C8102E" stroke-width="2.5"/><circle cx="551" cy="288" r="28" fill="#C8102E"/><text x="551" y="297" font-size="28" font-weight="900" fill="#fff" text-anchor="middle">٢</text><text x="509" y="280" font-size="27" font-weight="900" fill="#C8102E" text-anchor="end">تقليل فقد الماء</text><text x="509" y="318" font-size="20" font-weight="600" fill="#1F2937" text-anchor="end">بالنتح عبر فتحات الثغور</text><rect x="40" y="372" width="500" height="808" rx="16" fill="#FBFBFD"/><rect x="50" y="388" width="480" height="330" rx="14" fill="#fff" stroke="#009A44" stroke-width="2"/><text x="515" y="414" font-size="16" font-weight="800" fill="#0A4D2E" text-anchor="end">الخلايا الحارسة: فتحة الثغر مغلقة ومفتوحة</text><path d="M348,548 a62,108 0 1,0 124,0 a62,108 0 1,0 -124,0 Z M409,548 a1,82 0 1,0 2,0 a1,82 0 1,0 -2,0 Z" fill="#D8C28F" fill-rule="evenodd" stroke="#8B6F2F" stroke-width="2.5"/><ellipse cx="410" cy="548" rx="1" ry="82" fill="none" stroke="#5B4520" stroke-width="7"/><line x1="410" y1="438" x2="410" y2="466" stroke="#fff" stroke-width="5"/><line x1="410" y1="630" x2="410" y2="658" stroke="#fff" stroke-width="5"/><text x="410" y="682" font-size="14" font-weight="800" fill="#1F2937" text-anchor="middle">مغلقة: خلايا حارسة رخوة</text><path d="M84,548 a86,108 0 1,0 172,0 a86,108 0 1,0 -172,0 Z M146,548 a24,82 0 1,0 48,0 a24,82 0 1,0 -48,0 Z" fill="#D8C28F" fill-rule="evenodd" stroke="#8B6F2F" stroke-width="2.5"/><ellipse cx="170" cy="548" rx="24" ry="82" fill="#fff" stroke="#5B4520" stroke-width="7"/><line x1="170" y1="438" x2="170" y2="466" stroke="#fff" stroke-width="5"/><line x1="170" y1="630" x2="170" y2="658" stroke="#fff" stroke-width="5"/><text x="170" y="682" font-size="14" font-weight="800" fill="#1F2937" text-anchor="middle">مفتوحة: خلايا حارسة ممتلئة</text><text x="170" y="554" font-size="12" font-weight="800" fill="#6B7280" text-anchor="middle">فتحة</text><text x="170" y="570" font-size="12" font-weight="800" fill="#6B7280" text-anchor="middle">الثغر</text><polygon points="296,540 296,556 278,548" fill="#C9A961"/><text x="170" y="704" font-size="12.5" font-weight="700" fill="#6B7280" text-anchor="middle">الجدار الداخلي السميك (خطٌّ داكن)</text><circle cx="290" cy="478" r="24" fill="#009A44" stroke="#fff" stroke-width="3"/><text x="290" y="487" font-size="26" font-weight="900" fill="#fff" text-anchor="middle">١</text><rect x="50" y="734" width="480" height="432" rx="14" fill="#fff" stroke="#1E3A8A" stroke-width="2"/><text x="515" y="760" font-size="16" font-weight="800" fill="#1E3A8A" text-anchor="end">آليَّة الفتح (الشكل ٤-٢٦)</text><rect x="150" y="790" width="276" height="350" rx="40" fill="#FAF3E0" stroke="#8B6F2F" stroke-width="3"/><text x="96" y="788" font-size="13" font-weight="800" fill="#6B7280" text-anchor="middle">خارج الخليَّة</text><text x="290" y="812" font-size="13" font-weight="800" fill="#8B6F2F" text-anchor="middle">داخل الخليَّة الحارسة</text><path d="M170,840 L80,840" stroke="#C8102E" stroke-width="3.5" marker-end="url(#ahr)"/><text x="100" y="830" font-size="15" font-weight="800" fill="#C8102E" text-anchor="middle">‎H⁺‎</text><text x="410" y="846" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="end">مضخَّات البروتون تنقل H⁺ للخارج (ATP)</text><circle cx="466" cy="840" r="24" fill="#C8102E" stroke="#fff" stroke-width="3"/><text x="466" y="849" font-size="26" font-weight="900" fill="#fff" text-anchor="middle">٢</text><path d="M80,910 L170,910" stroke="#7C3AED" stroke-width="3.5" marker-end="url(#ahk)"/><text x="100" y="900" font-size="15" font-weight="800" fill="#7C3AED" text-anchor="middle">‎K⁺‎</text><text x="410" y="916" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="end">تُفتح قنوات K⁺ فيدخل البوتاسيوم</text><circle cx="466" cy="910" r="24" fill="#009A44" stroke="#fff" stroke-width="3"/><text x="466" y="919" font-size="26" font-weight="900" fill="#fff" text-anchor="middle">٣</text><text x="410" y="986" font-size="14" font-weight="800" fill="#0A4D2E" text-anchor="end">يقلُّ جهد الماء داخل الخليَّة (ψ)</text><path d="M80,1050 L170,1050" stroke="#0EA5E9" stroke-width="3.5" marker-end="url(#ahk)"/><text x="100" y="1040" font-size="15" font-weight="800" fill="#0EA5E9" text-anchor="middle">‎H₂O‎</text><text x="410" y="1056" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="end">يدخل الماء بالأسموزيَّة</text><circle cx="466" cy="1050" r="24" fill="#1E3A8A" stroke="#fff" stroke-width="3"/><text x="466" y="1059" font-size="26" font-weight="900" fill="#fff" text-anchor="middle">٤</text><text x="410" y="1126" font-size="14" font-weight="800" fill="#1E3A8A" text-anchor="end">تمتلئ الخليَّة ← تُفتح فتحة الثغر</text><rect x="560" y="372" width="630" height="150" rx="14" fill="#fff" stroke="#E5E7EB" stroke-width="1.5" filter="url(#sh)"/><rect x="1180" y="372" width="10" height="150" rx="5" fill="#009A44"/><rect x="560" y="372" width="620" height="56" rx="14" fill="#E6F7EE"/><rect x="560" y="412" width="620" height="16" fill="#E6F7EE"/><circle cx="1146" cy="400" r="21" fill="#009A44"/><text x="1146" y="409" font-size="24" font-weight="900" fill="#fff" text-anchor="middle">١</text><text x="1114" y="410" font-size="23" font-weight="800" fill="#0A4D2E" text-anchor="end">الخلايا الحارسة</text><circle cx="1156" cy="449" r="4.5" fill="#009A44"/><text x="1142" y="456" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">خليَّة بشرة على شكل كُلية توجد مع خليَّة أخرى في زوج يحيط بالثغر،</text><circle cx="1156" cy="475" r="4.5" fill="#009A44"/><text x="1142" y="482" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">وينظِّم فتحه أو إغلاقه. جدرانها التي تواجه الهواء وفتحة الثغر سميكة،</text><text x="1142" y="508" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">والتي تواجه خلايا البشرة أرقُّ بكثير؛ وألياف السليلوز مرتَّبة في حزم.</text><rect x="560" y="532" width="630" height="150" rx="14" fill="#fff" stroke="#E5E7EB" stroke-width="1.5" filter="url(#sh)"/><rect x="1180" y="532" width="10" height="150" rx="5" fill="#C8102E"/><rect x="560" y="532" width="620" height="56" rx="14" fill="#FEE9EC"/><rect x="560" y="572" width="620" height="16" fill="#FEE9EC"/><circle cx="1146" cy="560" r="21" fill="#C8102E"/><text x="1146" y="569" font-size="24" font-weight="900" fill="#fff" text-anchor="middle">٢</text><text x="1114" y="570" font-size="23" font-weight="800" fill="#C8102E" text-anchor="end">مضخَّات البروتون</text><circle cx="1156" cy="609" r="4.5" fill="#C8102E"/><text x="1142" y="616" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">تنقل مضخَّات البروتون في غشاء سطح الخليَّة، بطاقة ATP، أيونات</text><text x="1142" y="642" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">الهيدروجين إلى خارج الخليَّة الحارسة استجابة للضوء؛ فيصبح داخل</text><text x="1142" y="668" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">الخليَّة مشحونًا بشحنة سالبة مقارنة مع خارجها.</text><rect x="560" y="692" width="630" height="150" rx="14" fill="#fff" stroke="#E5E7EB" stroke-width="1.5" filter="url(#sh)"/><rect x="1180" y="692" width="10" height="150" rx="5" fill="#7C3AED"/><rect x="560" y="692" width="620" height="56" rx="14" fill="#E8F0FE"/><rect x="560" y="732" width="620" height="16" fill="#E8F0FE"/><circle cx="1146" cy="720" r="21" fill="#7C3AED"/><text x="1146" y="729" font-size="24" font-weight="900" fill="#fff" text-anchor="middle">٣</text><text x="1114" y="730" font-size="23" font-weight="800" fill="#7C3AED" text-anchor="end">دخول أيونات البوتاسيوم</text><circle cx="1156" cy="769" r="4.5" fill="#7C3AED"/><text x="1142" y="776" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">تُفتح القنوات البروتينيَّة الناقلة لأيونات البوتاسيوم، فتدخل الخليَّة مع</text><circle cx="1156" cy="795" r="4.5" fill="#7C3AED"/><text x="1142" y="802" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">المنحدر الكهروكيميائي. تزيد أيونات البوتاسيوم تركيز المواد المذابة،</text><text x="1142" y="828" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">فيقلُّ جهد الماء داخل الخلايا الحارسة.</text><rect x="560" y="852" width="630" height="150" rx="14" fill="#fff" stroke="#E5E7EB" stroke-width="1.5" filter="url(#sh)"/><rect x="1180" y="852" width="10" height="150" rx="5" fill="#1E3A8A"/><rect x="560" y="852" width="620" height="56" rx="14" fill="#E8F0FE"/><rect x="560" y="892" width="620" height="16" fill="#E8F0FE"/><circle cx="1146" cy="880" r="21" fill="#1E3A8A"/><text x="1146" y="889" font-size="24" font-weight="900" fill="#fff" text-anchor="middle">٤</text><text x="1114" y="890" font-size="23" font-weight="800" fill="#1E3A8A" text-anchor="end">دخول الماء وفتح الثغر</text><circle cx="1156" cy="929" r="4.5" fill="#1E3A8A"/><text x="1142" y="936" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">ينتقل الماء بالأسموزيَّة عبر الأكوابورينات إلى الفجوات، فيزداد ضغط الامتلاء.</text><circle cx="1156" cy="955" r="4.5" fill="#1E3A8A"/><text x="1142" y="962" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">تمنع حزم ألياف السليلوز التمدُّد في جميع الاتجاهات، فتزداد الخلايا طولًا،</text><text x="1142" y="988" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">وتنحني الجدران الداخليَّة السميكة، فيُفتح الثغر بين الخليَّتين.</text><rect x="560" y="1012" width="630" height="150" rx="14" fill="#fff" stroke="#E5E7EB" stroke-width="1.5" filter="url(#sh)"/><rect x="1180" y="1012" width="10" height="150" rx="5" fill="#C9A961"/><rect x="560" y="1012" width="620" height="56" rx="14" fill="#FBF4E4"/><rect x="560" y="1052" width="620" height="16" fill="#FBF4E4"/><circle cx="1146" cy="1040" r="21" fill="#C9A961"/><text x="1146" y="1049" font-size="24" font-weight="900" fill="#fff" text-anchor="middle">٥</text><text x="1114" y="1050" font-size="23" font-weight="800" fill="#8A6D2B" text-anchor="end">إغلاق الثغر</text><circle cx="1156" cy="1089" r="4.5" fill="#C9A961"/><text x="1142" y="1096" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">تتوقَّف مضخَّات البروتون، وتغادر أيونات البوتاسيوم، فيغادر الماء الخلايا</text><circle cx="1156" cy="1115" r="4.5" fill="#C9A961"/><text x="1142" y="1122" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">الحارسة فتصبح رخوة. يُقلِّل الإغلاق امتصاص ثاني أكسيد الكربون،</text><text x="1142" y="1148" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">لكنَّه يحتجز الماء داخل الورقة، وهو أمر مهمٌّ وقت الإجهاد المائي.</text><text x="1190" y="1222" font-size="26" font-weight="800" fill="#C8102E" text-anchor="end">تسلسل أحداث فتح الثغر</text><rect x="1028.3333333333333" y="1240" width="161.66666666666666" height="78" rx="12" fill="#FEE9EC" stroke="#C8102E" stroke-width="2"/><text x="1109.1666666666665" y="1271.5" font-size="15.5" font-weight="800" fill="#1F2937" text-anchor="middle">الضوء يُنشِّط</text><text x="1109.1666666666665" y="1296.5" font-size="15.5" font-weight="800" fill="#1F2937" text-anchor="middle">مضخَّات البروتون</text><path d="M1024.3333333333333,1279 L1002.3333333333333,1279" stroke="#C9A961" stroke-width="4" marker-end="url(#ah)"/><rect x="832.6666666666666" y="1240" width="161.66666666666666" height="78" rx="12" fill="#E6F7EE" stroke="#009A44" stroke-width="2"/><text x="913.5" y="1271.5" font-size="15.5" font-weight="800" fill="#1F2937" text-anchor="middle">خروج H⁺</text><text x="913.5" y="1296.5" font-size="15.5" font-weight="800" fill="#1F2937" text-anchor="middle">وشحنة داخليَّة سالبة</text><path d="M828.6666666666666,1279 L806.6666666666666,1279" stroke="#C9A961" stroke-width="4" marker-end="url(#ah)"/><rect x="637" y="1240" width="161.66666666666666" height="78" rx="12" fill="#E6F7EE" stroke="#009A44" stroke-width="2"/><text x="717.8333333333334" y="1271.5" font-size="15.5" font-weight="800" fill="#1F2937" text-anchor="middle">دخول K⁺</text><text x="717.8333333333334" y="1296.5" font-size="15.5" font-weight="800" fill="#1F2937" text-anchor="middle">إلى الخليَّة</text><path d="M633,1279 L611,1279" stroke="#C9A961" stroke-width="4" marker-end="url(#ah)"/><rect x="441.33333333333337" y="1240" width="161.66666666666666" height="78" rx="12" fill="#E6F7EE" stroke="#009A44" stroke-width="2"/><text x="522.1666666666667" y="1271.5" font-size="15.5" font-weight="800" fill="#1F2937" text-anchor="middle">انخفاض جهد</text><text x="522.1666666666667" y="1296.5" font-size="15.5" font-weight="800" fill="#1F2937" text-anchor="middle">الماء</text><path d="M437.33333333333337,1279 L415.33333333333337,1279" stroke="#C9A961" stroke-width="4" marker-end="url(#ah)"/><rect x="245.6666666666667" y="1240" width="161.66666666666666" height="78" rx="12" fill="#E6F7EE" stroke="#009A44" stroke-width="2"/><text x="326.50000000000006" y="1271.5" font-size="15.5" font-weight="800" fill="#1F2937" text-anchor="middle">دخول الماء</text><text x="326.50000000000006" y="1296.5" font-size="15.5" font-weight="800" fill="#1F2937" text-anchor="middle">بالأسموزيَّة</text><path d="M241.6666666666667,1279 L219.6666666666667,1279" stroke="#C9A961" stroke-width="4" marker-end="url(#ah)"/><rect x="50.00000000000006" y="1240" width="161.66666666666666" height="78" rx="12" fill="#FFF3D6" stroke="#B08A4A" stroke-width="2"/><text x="130.83333333333337" y="1271.5" font-size="15.5" font-weight="800" fill="#1F2937" text-anchor="middle">امتلاء الخلايا</text><text x="130.83333333333337" y="1296.5" font-size="15.5" font-weight="800" fill="#1F2937" text-anchor="middle">وفتح الثغر</text><rect x="640" y="1340" width="550" height="272" rx="14" fill="#fff" stroke="#C9A961" stroke-width="2"/><text x="1170" y="1378" font-size="23" font-weight="800" fill="#C8102E" text-anchor="end">مصطلحات علميَّة</text><text x="1170" y="1416" font-size="18" font-weight="700" fill="#1F2937" text-anchor="end">الخليَّة الحارسة: خليَّة بشرة على شكل كُلية توجد مع خليَّة</text><text x="1170" y="1442" font-size="18" font-weight="600" fill="#1F2937" text-anchor="end">أخرى في زوج يحيط بالثغر، وينظِّم فتحه أو إغلاقه.</text><text x="1170" y="1476" font-size="18" font-weight="700" fill="#1F2937" text-anchor="end">المنحدر الكهروكيميائي: منحدر عبر غشاء سطح الخليَّة يشمل</text><text x="1170" y="1502" font-size="18" font-weight="600" fill="#1F2937" text-anchor="end">الفرق في تركيز الأيونات وفرق الجهد.</text><rect x="50" y="1340" width="560" height="272" rx="14" fill="#fff" stroke="#C9A961" strok