<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
<defs>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&amp;display=swap');
  text { font-family: 'Cairo', system-ui, sans-serif; unicode-bidi: plaintext; }
  .title { font-size: 52px; font-weight: 900; fill: #1b5e20; }
  .subtitle { font-size: 28px; font-weight: 700; fill: #2e7d32; }
  .label { font-size: 24px; font-weight: 900; fill: #1b5e20; }
  .label-en { font-size: 18px; font-weight: 700; fill: #388e3c; }
  .small { font-size: 18px; font-weight: 600; fill: #1F2937; }
  .credit { font-size: 16px; font-weight: 700; fill: #0A4D2E; opacity: 0.7; }
</style>
<filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/></filter>
</defs>

<rect width="1200" height="800" fill="#FAFAFA"/>
<rect width="1200" height="8" fill="#C8102E"/>
<rect y="792" width="1200" height="8" fill="#009A44"/>

<text x="1140" y="60" class="title" text-anchor="end">تركيب البلاستيدة الخضراء</text>
<text x="1140" y="92" class="subtitle" text-anchor="end">الوحدة 7 • الدرس 7-1 • ٧ تراكيب رئيسة</text>

<!-- البلاستيدة (شكل بيضوي) -->
<g transform="translate(550 440)">
  <!-- الغشاء الخارجي -->
  <ellipse rx="380" ry="220" fill="#e8f5e9" stroke="#1b5e20" stroke-width="4" filter="url(#shadow)"/>
  <!-- الغشاء الداخلي -->
  <ellipse rx="355" ry="200" fill="#c8e6c9" stroke="#388e3c" stroke-width="2.5" fill-opacity="0.4"/>

  <!-- الجرانوم 1 (يمين) -->
  <g transform="translate(150 -60)">
    <rect x="-60" y="-50" width="120" height="16" rx="8" fill="#4caf50" stroke="#1b5e20" stroke-width="2"/>
    <rect x="-60" y="-30" width="120" height="16" rx="8" fill="#66bb6a" stroke="#1b5e20" stroke-width="2"/>
    <rect x="-60" y="-10" width="120" height="16" rx="8" fill="#4caf50" stroke="#1b5e20" stroke-width="2"/>
    <rect x="-60" y="10" width="120" height="16" rx="8" fill="#66bb6a" stroke="#1b5e20" stroke-width="2"/>
    <rect x="-60" y="30" width="120" height="16" rx="8" fill="#4caf50" stroke="#1b5e20" stroke-width="2"/>
  </g>

  <!-- الجرانوم 2 (وسط-أسفل) -->
  <g transform="translate(-50 50)">
    <rect x="-60" y="-50" width="120" height="16" rx="8" fill="#4caf50" stroke="#1b5e20" stroke-width="2"/>
    <rect x="-60" y="-30" width="120" height="16" rx="8" fill="#66bb6a" stroke="#1b5e20" stroke-width="2"/>
    <rect x="-60" y="-10" width="120" height="16" rx="8" fill="#4caf50" stroke="#1b5e20" stroke-width="2"/>
    <rect x="-60" y="10" width="120" height="16" rx="8" fill="#66bb6a" stroke="#1b5e20" stroke-width="2"/>
    <rect x="-60" y="30" width="120" height="16" rx="8" fill="#4caf50" stroke="#1b5e20" stroke-width="2"/>
  </g>

  <!-- الجرانوم 3 (يسار) -->
  <g transform="translate(-220 -30)">
    <rect x="-55" y="-40" width="110" height="14" rx="7" fill="#4caf50" stroke="#1b5e20" stroke-width="2"/>
    <rect x="-55" y="-22" width="110" height="14" rx="7" fill="#66bb6a" stroke="#1b5e20" stroke-width="2"/>
    <rect x="-55" y="-4" width="110" height="14" rx="7" fill="#4caf50" stroke="#1b5e20" stroke-width="2"/>
    <rect x="-55" y="14" width="110" height="14" rx="7" fill="#66bb6a" stroke="#1b5e20" stroke-width="2"/>
  </g>

  <!-- صفيحة تربط الجرانا -->
  <line x1="90" y1="-30" x2="-10" y2="40" stroke="#388e3c" stroke-width="3"/>
  <line x1="90" y1="-10" x2="-10" y2="60" stroke="#388e3c" stroke-width="3"/>

  <!-- حبيبة نشا -->
  <ellipse cx="100" cy="120" rx="35" ry="25" fill="#fff9c4" stroke="#f57f17" stroke-width="2"/>
  <text x="100" y="125" text-anchor="middle" font-size="18" font-weight="900" fill="#e65100">نشا</text>

  <!-- قطيرة دهنية -->
  <circle cx="200" cy="100" r="18" fill="#ffe082" stroke="#ff8f00" stroke-width="2"/>

  <!-- DNA حلقي -->
  <circle cx="-260" cy="80" r="22" fill="none" stroke="#1565c0" stroke-width="3"/>
  <text x="-260" y="86" text-anchor="middle" font-size="16" font-weight="900" fill="#0d47a1">DNA</text>

  <!-- رايبوسومات -->
  <circle cx="-180" cy="120" r="6" fill="#ce93d8" stroke="#7b1fa2" stroke-width="1.5"/>
  <circle cx="-160" cy="135" r="6" fill="#ce93d8" stroke="#7b1fa2" stroke-width="1.5"/>
  <circle cx="-140" cy="120" r="6" fill="#ce93d8" stroke="#7b1fa2" stroke-width="1.5"/>
  <circle cx="-170" cy="105" r="6" fill="#ce93d8" stroke="#7b1fa2" stroke-width="1.5"/>
</g>

<!-- ═══ التسميات حول البلاستيدة ═══ -->

<!-- 1. الغلاف المزدوج (أعلى يمين) -->
<g>
  <line x1="900" y1="290" x2="1020" y2="180" stroke="#1b5e20" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="1020" y="170" class="label" text-anchor="start">1️⃣ الغلاف المزدوج</text>
  <text x="1020" y="194" class="label-en" text-anchor="start">Double envelope</text>
  <text x="1020" y="218" class="small" text-anchor="start">غشاء خارجي + داخلي</text>
</g>

<!-- 2. الجرانوم (أعلى) -->
<g>
  <line x1="700" y1="380" x2="730" y2="280" stroke="#1b5e20" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="900" y="270" class="label" text-anchor="middle">2️⃣ الجرانوم</text>
  <text x="900" y="294" class="label-en" text-anchor="middle">Granum</text>
  <text x="900" y="318" class="small" text-anchor="middle">حزمة ثايلاكويدات</text>
  <text x="900" y="338" class="small" text-anchor="middle" fill="#C8102E" font-weight="900">المرحلة الضوئيَّة</text>
</g>

<!-- 3. الثايلاكويد (أعلى يسار) -->
<g>
  <line x1="610" y1="395" x2="510" y2="320" stroke="#1b5e20" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="380" y="310" class="label" text-anchor="start">3️⃣ الثايلاكويد</text>
  <text x="380" y="334" class="label-en" text-anchor="start">Thylakoid</text>
  <text x="380" y="358" class="small" text-anchor="start">قرص غشائي بصبغات</text>
</g>

<!-- 4. الصفائح (يسار) -->
<g>
  <line x1="560" y1="450" x2="380" y2="450" stroke="#388e3c" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="245" y="445" class="label" text-anchor="middle">4️⃣ الصفائح</text>
  <text x="245" y="469" class="label-en" text-anchor="middle">Lamellae</text>
  <text x="245" y="493" class="small" text-anchor="middle">تربط الجرانا</text>
</g>

<!-- 5. الستروما (أسفل) -->
<g>
  <line x1="650" y1="600" x2="900" y2="675" stroke="#1b5e20" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="900" y="700" class="label" text-anchor="middle">5️⃣ الستروما</text>
  <text x="900" y="724" class="label-en" text-anchor="middle">Stroma</text>
  <text x="900" y="746" class="small" text-anchor="middle" fill="#009A44" font-weight="900">دورة كالفن — المرحلة غير الضوئيَّة</text>
</g>

<!-- 6. DNA + رايبوسومات (يسار-أسفل) -->
<g>
  <line x1="350" y1="540" x2="200" y2="640" stroke="#1565c0" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="180" y="660" class="label" text-anchor="middle" fill="#0d47a1">6️⃣ DNA + رايبوسومات</text>
  <text x="180" y="684" class="label-en" text-anchor="middle" fill="#1565c0">DNA &amp; 70S Ribosomes</text>
  <text x="180" y="708" class="small" text-anchor="middle">دلائل النشأة الداخليَّة</text>
</g>

<!-- 7. حبيبة نشا + قطيرة دهنية (يمين) -->
<g>
  <line x1="700" y1="580" x2="1050" y2="600" stroke="#e65100" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="1070" y="595" class="label" text-anchor="start" fill="#e65100">7️⃣ حبيبة نشا</text>
  <text x="1070" y="619" class="label-en" text-anchor="start" fill="#ff8f00">Starch grain</text>
  <text x="1070" y="643" class="small" text-anchor="start">+ قطيرات دهنيَّة</text>
  <text x="1070" y="663" class="small" text-anchor="start">منتجات/مخازن الطاقة</text>
</g>

<!-- شارة سفل (نُقلت لمنتصف-يسار لتجنُّب التداخل مع التسميات) -->
<g transform="translate(280 770)">
  <rect x="-220" y="-18" width="440" height="36" rx="18" fill="#1b5e20" filter="url(#shadow)"/>
  <text y="6" text-anchor="middle" font-size="16" font-weight="900" fill="#FFFFFF">💡 غلاف مزدوج + 70S DNA = نشأة داخليَّة</text>
</g>

<text x="60" y="775" class="credit" text-anchor="start">أ. محمد الحضري • منصَّة الأحياء</text>
</svg>
