<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
<defs>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&amp;display=swap');
  text { font-family: 'Cairo', system-ui, sans-serif; unicode-bidi: plaintext; }
  .title { font-size: 52px; font-weight: 900; fill: #C8102E; }
  .subtitle { font-size: 28px; font-weight: 700; fill: #0A4D2E; }
  .col-title { font-size: 38px; font-weight: 900; fill: #FFFFFF; }
  .row-label { font-size: 24px; font-weight: 900; unicode-bidi: plaintext; }
  .row-text { font-size: 22px; font-weight: 600; fill: #1F2937; unicode-bidi: plaintext; }
  .similar { font-size: 22px; font-weight: 700; fill: #0A4D2E; unicode-bidi: plaintext; }
  .credit { font-size: 16px; font-weight: 700; fill: #0A4D2E; opacity: 0.7; }
</style>
<filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/></filter>
</defs>

<rect width="1200" height="800" fill="#FAFAFA"/>
<rect width="1200" height="8" fill="#C8102E"/>
<rect y="792" width="1200" height="8" fill="#009A44"/>

<text x="600" y="60" class="title" text-anchor="middle">البلاستيدة الخضراء ⚖ الميتوكوندريا</text>
<text x="600" y="92" class="subtitle" text-anchor="middle">الوحدة 7 • الدرس 7-1 • مقارنة شاملة</text>

<!-- العمود الأيمن: البلاستيدة الخضراء -->
<g transform="translate(910 130)">
  <rect x="-230" y="0" width="460" height="475" rx="20" fill="#FFFFFF" stroke="#E6F7EE" stroke-width="3" filter="url(#shadow)"/>
  <rect x="-230" y="0" width="460" height="90" rx="20" fill="#1b5e20"/>
  <rect x="-230" y="70" width="460" height="20" fill="#1b5e20"/>
  <text x="0" y="40" text-anchor="middle" font-size="26" font-weight="900" fill="#FFFFFF">🌿</text>
  <text x="0" y="72" class="col-title" text-anchor="middle">البلاستيدة الخضراء</text>

  <g transform="translate(0 130)">
    <text x="200" y="0" class="row-label" text-anchor="end" fill="#1b5e20">🧪 المادَّة الأساسيَّة</text>
    <text x="200" y="28" class="row-text" text-anchor="end">الستروما — إنزيمات دورة كالفن</text>
  </g>
  <line x1="-200" y1="158" x2="200" y2="158" stroke="#F5F5F5" stroke-width="2"/>

  <g transform="translate(0 188)">
    <text x="200" y="0" class="row-label" text-anchor="end" fill="#1b5e20">📐 الأغشية الداخليَّة</text>
    <text x="200" y="28" class="row-text" text-anchor="end">الثايلاكويدات (جرانا + صفائح)</text>
  </g>
  <line x1="-200" y1="218" x2="200" y2="218" stroke="#F5F5F5" stroke-width="2"/>

  <g transform="translate(0 248)">
    <text x="200" y="0" class="row-label" text-anchor="end" fill="#1b5e20">🎨 الصبغات</text>
    <text x="200" y="28" class="row-text" text-anchor="end">كلوروفيل + كاروتين + زانثوفيل</text>
  </g>
  <line x1="-200" y1="278" x2="200" y2="278" stroke="#F5F5F5" stroke-width="2"/>

  <g transform="translate(0 308)">
    <text x="200" y="0" class="row-label" text-anchor="end" fill="#1b5e20">⚡ سلسلة نقل الإلكترون</text>
    <text x="200" y="28" class="row-text" text-anchor="end">في أغشية الثايلاكويد</text>
  </g>
  <line x1="-200" y1="338" x2="200" y2="338" stroke="#F5F5F5" stroke-width="2"/>

  <g transform="translate(0 368)">
    <text x="200" y="0" class="row-label" text-anchor="end" fill="#1b5e20">🎯 الوظيفة</text>
    <text x="200" y="28" class="row-text" text-anchor="end">التمثيل الضوئي — بناء الجلوكوز</text>
  </g>
  <line x1="-200" y1="398" x2="200" y2="398" stroke="#F5F5F5" stroke-width="2"/>

  <g transform="translate(0 428)">
    <text x="200" y="0" class="row-label" text-anchor="end" fill="#1b5e20">📍 الخليَّة</text>
    <text x="200" y="28" class="row-text" text-anchor="end">في النباتات والطحالب فقط</text>
  </g>
</g>

<!-- VS الوسط -->
<circle cx="600" cy="365" r="60" fill="#FFFFFF" stroke="#C9A961" stroke-width="4" filter="url(#shadow)"/>
<text x="600" y="383" text-anchor="middle" font-size="48" font-weight="900" fill="#C9A961">VS</text>

<!-- العمود الأيسر: الميتوكوندريا -->
<g transform="translate(290 130)">
  <rect x="-230" y="0" width="460" height="475" rx="20" fill="#FFFFFF" stroke="#FEE9EC" stroke-width="3" filter="url(#shadow)"/>
  <rect x="-230" y="0" width="460" height="90" rx="20" fill="#C8102E"/>
  <rect x="-230" y="70" width="460" height="20" fill="#C8102E"/>
  <text x="0" y="40" text-anchor="middle" font-size="26" font-weight="900" fill="#FFFFFF">🔋</text>
  <text x="0" y="72" class="col-title" text-anchor="middle">الميتوكوندريا</text>

  <g transform="translate(0 130)">
    <text x="-200" y="0" class="row-label" text-anchor="start" fill="#C8102E">🧪 المادَّة الأساسيَّة</text>
    <text x="-200" y="28" class="row-text" text-anchor="start">الحشوة — إنزيمات دورة كربس</text>
  </g>
  <line x1="-200" y1="158" x2="200" y2="158" stroke="#F5F5F5" stroke-width="2"/>

  <g transform="translate(0 188)">
    <text x="-200" y="0" class="row-label" text-anchor="start" fill="#C8102E">📐 الأغشية الداخليَّة</text>
    <text x="-200" y="28" class="row-text" text-anchor="start">الأعراف (تطوُّيات الغشاء الداخلي)</text>
  </g>
  <line x1="-200" y1="218" x2="200" y2="218" stroke="#F5F5F5" stroke-width="2"/>

  <g transform="translate(0 248)">
    <text x="-200" y="0" class="row-label" text-anchor="start" fill="#C8102E">🎨 الصبغات</text>
    <text x="-200" y="28" class="row-text" text-anchor="start">لا توجد صبغات</text>
  </g>
  <line x1="-200" y1="278" x2="200" y2="278" stroke="#F5F5F5" stroke-width="2"/>

  <g transform="translate(0 308)">
    <text x="-200" y="0" class="row-label" text-anchor="start" fill="#C8102E">⚡ سلسلة نقل الإلكترون</text>
    <text x="-200" y="28" class="row-text" text-anchor="start">في أغشية الأعراف</text>
  </g>
  <line x1="-200" y1="338" x2="200" y2="338" stroke="#F5F5F5" stroke-width="2"/>

  <g transform="translate(0 368)">
    <text x="-200" y="0" class="row-label" text-anchor="start" fill="#C8102E">🎯 الوظيفة</text>
    <text x="-200" y="28" class="row-text" text-anchor="start">التنفُّس الهوائي — هدم الجلوكوز</text>
  </g>
  <line x1="-200" y1="398" x2="200" y2="398" stroke="#F5F5F5" stroke-width="2"/>

  <g transform="translate(0 428)">
    <text x="-200" y="0" class="row-label" text-anchor="start" fill="#C8102E">📍 الخليَّة</text>
    <text x="-200" y="28" class="row-text" text-anchor="start">في كل حقيقيَّات النوى</text>
  </g>
</g>

<!-- أوجه التشابه -->
<g transform="translate(600 660)">
  <rect x="-560" y="-50" width="1120" height="100" rx="20" fill="#FAF5E8" stroke="#C9A961" stroke-width="3" filter="url(#shadow)"/>
  <text y="-20" text-anchor="middle" font-size="26" font-weight="900" fill="#C9A961">🔗 أوجه التشابه</text>
  <text y="14" class="similar" text-anchor="middle">١. غلاف مزدوج (غشاءان غير متلامسَين)  •  ٢. DNA حلقي صغير  •  ٣. رايبوسومات 70S</text>
  <text y="40" class="similar" text-anchor="middle">٤. نظام من الأغشية الداخليَّة يزيد مساحة السطح  •  ٥. تنشأ بانقسام ذاتي (نشأة داخليَّة)</text>
</g>

<text x="60" y="775" class="credit" text-anchor="start">أ. محمد الحضري • منصَّة الأحياء • أحياء الصف الثاني عشر</text>
</svg>
