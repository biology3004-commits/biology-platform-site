<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" width="1240" height="1754" font-family="Cairo, Tajawal, system-ui, sans-serif">
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&amp;display=swap'); text { font-family: 'Cairo', 'Tajawal', system-ui, sans-serif; unicode-bidi: plaintext; }</style>
<filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.08"/></filter>
<marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C9A961"/></marker>
<marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="16" refY="10" orient="auto"><path d="M0,2 L18,10 L0,18 z" fill="#C8102E"/></marker>
<marker id="ahn" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="16" refY="10" orient="auto"><path d="M0,2 L18,10 L0,18 z" fill="#1E3A8A"/></marker>
<marker id="ahg" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="16" refY="10" orient="auto"><path d="M0,2 L18,10 L0,18 z" fill="#009A44"/></marker>
<marker id="ahk" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="16" refY="10" orient="auto"><path d="M0,2 L18,10 L0,18 z" fill="#555"/></marker></defs>
<rect width="1240" height="1754" fill="#FAFAFA"/><rect width="1240" height="14" fill="#C8102E"/><rect y="1740" width="1240" height="14" fill="#009A44"/><text x="1190" y="98" font-size="62" font-weight="900" fill="#C8102E" text-anchor="end">المايلين والنقل الوثبي</text><text x="1190" y="146" font-size="26" font-weight="700" fill="#1F2937" text-anchor="end">الوحدة الخامسة: التحكُّم والتنسيق  •  الدرس ٥-٢: التواصل العصبي</text><rect x="50" y="52" width="250" height="84" rx="14" fill="#E6F7EE" stroke="#009A44" stroke-width="2"/><text x="175" y="88" font-size="20" font-weight="800" fill="#0A4D2E" text-anchor="middle">أحياء الصف الثاني عشر</text><text x="175" y="118" font-size="20" font-weight="700" fill="#0A4D2E" text-anchor="middle">الفصل الدراسي الأوَّل</text><line x1="50" y1="172" x2="1190" y2="172" stroke="#C9A961" stroke-width="3"/><text x="1190" y="216" font-size="28" font-weight="800" fill="#1F2937" text-anchor="end">يوجد نوعان من الخلايا العصبيَّة بحسب غلاف محاورها الأسطوانيَّة:</text><rect x="643" y="236" width="547" height="104" rx="18" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/><circle cx="1144" cy="288" r="28" fill="#B45309"/><text x="1144" y="297" font-size="28" font-weight="900" fill="#fff" text-anchor="middle">١</text><text x="1102" y="280" font-size="27" font-weight="900" fill="#B45309" text-anchor="end">خلايا عصبيَّة مايلينيَّة</text><text x="1102" y="318" font-size="20" font-weight="600" fill="#1F2937" text-anchor="end">محاطة بحلقات داكنة من المايلين</text><path d="M639,288 L609,288" stroke="#C9A961" stroke-width="4" marker-end="url(#ah)"/><rect x="50" y="236" width="547" height="104" rx="18" fill="#E8F0FE" stroke="#1E3A8A" stroke-width="2.5"/><circle cx="551" cy="288" r="28" fill="#1E3A8A"/><text x="551" y="297" font-size="28" font-weight="900" fill="#fff" text-anchor="middle">٢</text><text x="509" y="280" font-size="27" font-weight="900" fill="#1E3A8A" text-anchor="end">خلايا عصبيَّة غير مايلينيَّة</text><text x="509" y="318" font-size="20" font-weight="600" fill="#1F2937" text-anchor="end">نحو ثلثَي الخلايا الحركيَّة والحسِّيَّة</text><rect x="40" y="372" width="500" height="808" rx="16" fill="#FBFBFD"/><rect x="50" y="388" width="480" height="270" rx="14" fill="#fff" stroke="#B45309" stroke-width="2"/><text x="515" y="414" font-size="16" font-weight="800" fill="#B45309" text-anchor="end">مقطع عرضي: تكوُّن غمد المايلين</text><circle cx="250" cy="533" r="104" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><circle cx="250" cy="533" r="92" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/><circle cx="250" cy="533" r="80" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><circle cx="250" cy="533" r="68" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/><circle cx="250" cy="533" r="46" fill="#FBCFE8" stroke="#BE185D" stroke-width="2.5"/><text x="250" y="539" font-size="14" font-weight="800" fill="#BE185D" text-anchor="middle">المحور</text><text x="250" y="557" font-size="13" font-weight="800" fill="#BE185D" text-anchor="middle">الأسطواني</text><ellipse cx="290" cy="635" rx="30" ry="13" fill="#C4B5FD" stroke="#6D28D9" stroke-width="2"/><line x1="322" y1="635" x2="420" y2="635" stroke="#9CA3AF"/><text x="424" y="640" font-size="13" font-weight="800" fill="#1F2937" text-anchor="start">نواة خليَّة شوان</text><line x1="350" y1="493" x2="420" y2="473" stroke="#9CA3AF"/><text x="424" y="478" font-size="13" font-weight="800" fill="#1F2937" text-anchor="start">طبقات من غشاء</text><text x="424" y="496" font-size="13" font-weight="800" fill="#1F2937" text-anchor="start">سطح خليَّة شوان</text><text x="424" y="553" font-size="13" font-weight="800" fill="#0A4D2E" text-anchor="start">غنيَّة بالدهون</text><text x="424" y="571" font-size="13" font-weight="800" fill="#0A4D2E" text-anchor="start">فهي عازلة</text><circle cx="80" cy="448" r="24" fill="#B45309" stroke="#fff" stroke-width="3"/><text x="80" y="457" font-size="26" font-weight="900" fill="#fff" text-anchor="middle">١</text><rect x="50" y="674" width="480" height="236" rx="14" fill="#fff" stroke="#1E3A8A" stroke-width="2"/><text x="515" y="700" font-size="16" font-weight="800" fill="#1E3A8A" text-anchor="end">النقل الوثبي: يقفز جهد الفعل بين العقد</text><rect x="62" y="794" width="456" height="20" fill="#FBCFE8" stroke="#BE185D" stroke-width="1.5"/><rect x="70" y="774" width="100" height="60" rx="20" fill="#FDE68A" stroke="#B45309" stroke-width="2"/><rect x="186" y="774" width="100" height="60" rx="20" fill="#FDE68A" stroke="#B45309" stroke-width="2"/><rect x="302" y="774" width="100" height="60" rx="20" fill="#FDE68A" stroke="#B45309" stroke-width="2"/><rect x="418" y="774" width="92" height="60" rx="20" fill="#FDE68A" stroke="#B45309" stroke-width="2"/><rect x="173" y="790" width="10" height="28" fill="#F59E0B"/><rect x="289" y="790" width="10" height="28" fill="#F59E0B"/><rect x="405" y="790" width="10" height="28" fill="#F59E0B"/><path d="M178,768 Q236,708 294,768" fill="none" stroke="#C8102E" stroke-width="3.5" marker-end="url(#ahr)"/><path d="M294,768 Q352,708 410,768" fill="none" stroke="#C8102E" stroke-width="3.5" marker-end="url(#ahr)"/><text x="236" y="728" font-size="13" font-weight="800" fill="#C8102E" text-anchor="middle">تقفز</text><text x="352" y="728" font-size="13" font-weight="800" fill="#C8102E" text-anchor="middle">تقفز</text><line x1="294" y1="820" x2="294" y2="862" stroke="#9CA3AF"/><text x="294" y="878" font-size="13.5" font-weight="800" fill="#B45309" text-anchor="middle">عقدة رانفييه</text><line x1="120" y1="836" x2="120" y2="862" stroke="#9CA3AF"/><text x="120" y="878" font-size="13.5" font-weight="800" fill="#B45309" text-anchor="middle">غمد المايلين</text><line x1="514" y1="814" x2="480" y2="862" stroke="#9CA3AF"/><text x="470" y="878" font-size="13.5" font-weight="800" fill="#BE185D" text-anchor="middle">المحور</text><text x="290" y="900" font-size="13" font-weight="700" fill="#6B7280" text-anchor="middle">المسافة بين عقدتين نحو ‎1–3 mm‎</text><circle cx="80" cy="734" r="24" fill="#1E3A8A" stroke="#fff" stroke-width="3"/><text x="80" y="743" font-size="26" font-weight="900" fill="#fff" text-anchor="middle">٢</text><rect x="50" y="926" width="480" height="240" rx="14" fill="#fff" stroke="#009A44" stroke-width="2"/><text x="515" y="952" font-size="16" font-weight="800" fill="#0A4D2E" text-anchor="end">سرعة انتقال النبضات العصبيَّة</text><rect x="212" y="976" width="300" height="30" rx="6" fill="#009A44"/><text x="505" y="997" font-size="13.5" font-weight="800" fill="#fff" text-anchor="end">مايلينيَّة</text><text x="200" y="997" font-size="14" font-weight="800" fill="#1F2937" text-anchor="end">حتى ‎100 m/s‎</text><rect x="392" y="1020" width="120" height="30" rx="6" fill="#F59E0B"/><text x="505" y="1041" font-size="13.5" font-weight="800" fill="#fff" text-anchor="end">غير مايلينيَّة</text><text x="380" y="1041" font-size="14" font-weight="800" fill="#1F2937" text-anchor="end">قد تصل إلى ‎0.5 m/s‎</text><text x="290" y="1082" font-size="14" font-weight="800" fill="#0A4D2E" text-anchor="middle">يمكن أن يزيد النقل الوثبي سرعة التوصيل حتى 50 ضعفًا</text><text x="290" y="1104" font-size="13" font-weight="700" fill="#1F2937" text-anchor="middle">مقارنة بمحور غير مايليني له القطر نفسه</text><text x="290" y="1150" font-size="12.5" font-weight="700" fill="#6B7280" text-anchor="middle">يُقدَّر أنَّ نحو ثلثَي الخلايا العصبيَّة الحركيَّة والحسِّيَّة غير مايلينيَّة</text><circle cx="78" cy="946" r="24" fill="#009A44" stroke="#fff" stroke-width="3"/><text x="78" y="955" font-size="26" font-weight="900" fill="#fff" text-anchor="middle">٥</text><rect x="560" y="372" width="630" height="150" rx="14" fill="#fff" stroke="#E5E7EB" stroke-width="1.5" filter="url(#sh)"/><rect x="1180" y="372" width="10" height="150" rx="5" fill="#B45309"/><rect x="560" y="372" width="620" height="56" rx="14" fill="#FEF3C7"/><rect x="560" y="412" width="620" height="16" fill="#FEF3C7"/><circle cx="1146" cy="400" r="21" fill="#B45309"/><text x="1146" y="409" font-size="24" font-weight="900" fill="#fff" text-anchor="middle">١</text><text x="1114" y="410" font-size="23" font-weight="800" fill="#B45309" text-anchor="end">غمد المايلين وخلايا شوان</text><circle cx="1156" cy="449" r="4.5" fill="#B45309"/><text x="1142" y="456" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">تلتفُّ خليَّة شوان بشكل لولبي حول المحور الأسطواني، وتحيطه بطبقات عديدة</text><circle cx="1156" cy="475" r="4.5" fill="#B45309"/><text x="1142" y="482" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">من غشاء سطح الخليَّة الخاص بها، مكوِّنة غمد المايلين. المايلين غنيٌّ جدًّا</text><text x="1142" y="508" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">بالدهون، فهو غير منفذ للماء والأيونات في سوائل الأنسجة.</text><rect x="560" y="532" width="630" height="150" rx="14" fill="#fff" stroke="#E5E7EB" stroke-width="1.5" filter="url(#sh)"/><rect x="1180" y="532" width="10" height="150" rx="5" fill="#1E3A8A"/><rect x="560" y="532" width="620" height="56" rx="14" fill="#E8F0FE"/><rect x="560" y="572" width="620" height="16" fill="#E8F0FE"/><circle cx="1146" cy="560" r="21" fill="#1E3A8A"/><text x="1146" y="569" font-size="24" font-weight="900" fill="#fff" text-anchor="middle">٢</text><text x="1114" y="570" font-size="23" font-weight="800" fill="#1E3A8A" text-anchor="end">عقد رانفييه</text><circle cx="1156" cy="609" r="4.5" fill="#1E3A8A"/><text x="1142" y="616" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">فاصل أو فجوة قصيرة جدًّا بين خلايا شوان، المحور الأسطواني فيها</text><circle cx="1156" cy="635" r="4.5" fill="#1E3A8A"/><text x="1142" y="642" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">غير مغطًّى بالمايلين ومكشوف للسائل النسيجي. توجد كلَّ ‎1–3 mm‎ تقريبًا،</text><text x="1142" y="668" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">وطولها صغير جدًّا بين ‎2–3 µm‎.</text><rect x="560" y="692" width="630" height="150" rx="14" fill="#fff" stroke="#E5E7EB" stroke-width="1.5" filter="url(#sh)"/><rect x="1180" y="692" width="10" height="150" rx="5" fill="#009A44"/><rect x="560" y="692" width="620" height="56" rx="14" fill="#E6F7EE"/><rect x="560" y="732" width="620" height="16" fill="#E6F7EE"/><circle cx="1146" cy="720" r="21" fill="#009A44"/><text x="1146" y="729" font-size="24" font-weight="900" fill="#fff" text-anchor="middle">٣</text><text x="1114" y="730" font-size="23" font-weight="800" fill="#0A4D2E" text-anchor="end">لماذا لا يحدث جهد فعل تحت المايلين؟</text><circle cx="1156" cy="769" r="4.5" fill="#009A44"/><text x="1142" y="776" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">يعزل المايلين غشاء سطح المحور الأسطواني، فلا تستطيع أيونات الصوديوم</text><circle cx="1156" cy="795" r="4.5" fill="#009A44"/><text x="1142" y="802" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">والبوتاسيوم المرور عبره؛ ولا تحدث إزالة الاستقطاب إلا في عقد رانفييه،</text><text x="1142" y="828" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">حيث تتركَّز جميع البروتينات القنويَّة ومضخَّات الصوديوم والبوتاسيوم.</text><rect x="560" y="852" width="630" height="124" rx="14" fill="#fff" stroke="#E5E7EB" stroke-width="1.5" filter="url(#sh)"/><rect x="1180" y="852" width="10" height="124" rx="5" fill="#C8102E"/><rect x="560" y="852" width="620" height="56" rx="14" fill="#FEE9EC"/><rect x="560" y="892" width="620" height="16" fill="#FEE9EC"/><circle cx="1146" cy="880" r="21" fill="#C8102E"/><text x="1146" y="889" font-size="24" font-weight="900" fill="#fff" text-anchor="middle">٤</text><text x="1114" y="890" font-size="23" font-weight="800" fill="#C8102E" text-anchor="end">النقل الوثبي (Saltatory conduction)</text><circle cx="1156" cy="929" r="4.5" fill="#C8102E"/><text x="1142" y="936" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">تنتقل الدوائر الموضعيَّة من عقدة رانفييه إلى العقدة التي تليها، فإنَّ جهود</text><text x="1142" y="962" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">الفعل «تقفز» من عقدة إلى العقدة التي تليها عبر مسافة نحو ‎1–3 mm‎.</text><rect x="560" y="986" width="630" height="150" rx="14" fill="#fff" stroke="#E5E7EB" stroke-width="1.5" filter="url(#sh)"/><rect x="1180" y="986" width="10" height="150" rx="5" fill="#009A44"/><rect x="560" y="986" width="620" height="56" rx="14" fill="#E6F7EE"/><rect x="560" y="1026" width="620" height="16" fill="#E6F7EE"/><circle cx="1146" cy="1014" r="21" fill="#009A44"/><text x="1146" y="1023" font-size="24" font-weight="900" fill="#fff" text-anchor="middle">٥</text><text x="1114" y="1024" font-size="23" font-weight="800" fill="#0A4D2E" text-anchor="end">أثر ذلك في السرعة</text><circle cx="1156" cy="1063" r="4.5" fill="#009A44"/><text x="1142" y="1070" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">في الخلايا غير المايلينيَّة تكون سرعة التوصيل بطيئة، تصل إلى ‎0.5 m/s‎،</text><circle cx="1156" cy="1089" r="4.5" fill="#009A44"/><text x="1142" y="1096" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">وفي المايلينيَّة لدى الثدييات تصل إلى ‎100 m/s‎. أي أنَّ النقل الوثبي</text><text x="1142" y="1122" font-size="18.5" font-weight="600" fill="#1F2937" text-anchor="end">يزيد السرعة بما يصل إلى 50 ضعفًا لمحور غير مايليني له القطر نفسه.</text><text x="1190" y="1222" font-size="26" font-weight="800" fill="#C8102E" text-anchor="end">انتقال جهد الفعل في محور مايليني</text><rect x="989.2" y="1240" width="200.8" height="78" rx="12" fill="#FEE9EC" stroke="#C8102E" stroke-width="2"/><text x="1089.6000000000001" y="1271.5" font-size="19" font-weight="800" fill="#1F2937" text-anchor="middle">جهد فعل عند</text><text x="1089.6000000000001" y="1296.5" font-size="19" font-weight="800" fill="#1F2937" text-anchor="middle">عقدة رانفييه</text><path d="M985.2,1279 L963.2,1279" stroke="#C9A961" stroke-width="4" marker-end="url(#ah)"/><rect x="754.4000000000001" y="1240" width="200.8" height="78" rx="12" fill="#E6F7EE" stroke="#009A44" stroke-width="2"/><text x="854.8000000000001" y="1271.5" font-size="19" font-weight="800" fill="#1F2937" text-anchor="middle">دوائر موضعيَّة</text><text x="854.8000000000001" y="1296.5" font-size="19" font-weight="800" fill="#1F2937" text-anchor="middle">تحت المايلين</text><path d="M750.4000000000001,1279 L728.4000000000001,1279" stroke="#C9A961" stroke-width="4" marker-end="url(#ah)"/><rect x="519.6000000000001" y="1240" width="200.8" height="78" rx="12" fill="#E6F7EE" stroke="#009A44" stroke-width="2"/><text x="620.0000000000001" y="1271.5" font-size="19" font-weight="800" fill="#1F2937" text-anchor="middle">إزالة الاستقطاب</text><text x="620.0000000000001" y="1296.5" font-size="19" font-weight="800" fill="#1F2937" text-anchor="middle">في العقدة التالية</text><path d="M515.6000000000001,1279 L493.60000000000014,1279" stroke="#C9A961" stroke-width="4" marker-end="url(#ah)"/><rect x="284.8000000000001" y="1240" width="200.8" height="78" rx="12" fill="#E6F7EE" stroke="#009A44" stroke-width="2"/><text x="385.20000000000016" y="1271.5" font-size="19" font-weight="800" fill="#1F2937" text-anchor="middle">جهد فعل</text><text x="385.20000000000016" y="1296.5" font-size="19" font-weight="800" fill="#1F2937" text-anchor="middle">جديد</text><path d="M280.8000000000001,1279 L258.8000000000001,1279" stroke="#C9A961" stroke-width="4" marker-end="url(#ah)"/><rect x="50.000000000000114" y="1240" width="200.8" height="78" rx="12" fill="#FFF3D6" stroke="#B08A4A" stroke-width="2"/><text x="150.40000000000012" y="1271.5" font-size="19" font-weight="800" fill="#1F2937" text-anchor="middle">«قفزة» سريعة</text><text x="150.40000000000012" y="1296.5" font-size="19" font-weight="800" fill="#1F2937" text-anchor="middle">على طول المحور</text><rect x="640" y="1340" width="550" height="272" rx="14" fill="#fff" stroke="#C9A961" stroke-width="2"/><text x="1170" y="1378" font-size="23" font-weight="800" fill="#C8102E" text-anchor="end">مصطلحات علميَّة</text><text x="1170" y="1416" font-size="18" font-weight="700" fill="#1F2937" text-anchor="end">المايلين: مادَّة عازلة تحيط بالمحاور الأسطوانيَّة للعديد من الخلايا</text><text x="1170" y="1442" font-size="18" font-weight="600" fill="#1F2937" text-anchor="end">العصبيَّة، تتكوَّن من طبقات من أغشية سطح خلايا شوان.</text><text x="1170" y="1476" font-size="18" font-weight="700" fill="#1F2937" text-anchor="end">عقدة رانفييه: فجوة قصيرة جدًّا بين خلايا شوان، المحور فيها</text><text x="1170" y="1502" font-size="18" font-weight="600" fill="#1F2937" text-anchor="end">غير مغطًّى بالمايلين.</text><text x="1170" y="1536" font-size="18" font-weight="700" fill="#1F2937" text-anchor="end">النقل الوثبي: انتقال جهد الفعل على طول محور مايليني، حيث</text><text x="1170" y="1562" font-size="18" font-weight="600" fill="#1F2937" text-anchor="end">«يقفز» جهد الفعل من عقدة رانفييه إلى العقدة التالية.</text><rect x="50" y="1340" width="560" height="272" rx="14" fill="#fff" stroke="#C9A961" stroke-width="2"/><text x="590" y="1376" font-size="21" font-weight="800" fill="#C8102E" text-anchor="end"></text><text x="590" y="1380" font-size="16.5" font-weight="800" fill="#C8102E" text-anchor="end">عاملان يحدِّدان سرعة انتقال النبضات العصبيَّة:</text><text x="590" y="1410" font-size="15" font-weight="700" fill="#1F2937" text-anchor="end">١) وجود أو عدم وجود غلاف المايلين حول المحور الأسطواني.</text><text x="590" y="1440" font-size="15" font-weight="700" fill="#1F2937" text-anchor="end">٢) قطر المحور الأسطواني: كلَّما زاد القطر زادت السرعة.</text><text x="590" y="1470" font-size="15" font-weight="600" fill="#1F2937" text-anchor="end">محاور الحبار العملاقة غير المايلينيَّة: قطرها ‎500 µm‎</text><text x="590" y="1500" font-size="15" font-weight="600" fill="#1F2937" text-anchor="end">وسرعتها ‎25 m/s‎ فقط.</text><text x="590" y="1530" font-size="15" font-weight="600" fill="#1F2937" text-anchor="end">محاور حركيَّة كبيرة في رِجل الإنسان (مايلينيَّة): قطرها ‎20 µm‎</text><text x="590" y="1560" font-size="15" font-weight="600" fill="#1F2937" text-anchor="end">وسرعتها ‎120 m/s‎.</text><text x="1190" y="1720" font-size="16" font-weight="600" fill="#6B7280" text-anchor="end">المصدر: كتاب الطالب — الأحياء ١٢ الفصل الأوَّل، ص ١٦٩–١٨٠</text><text x="50" y="1720" font-size="16" font-weight="700" fill="#6B7280" text-anchor="start">أ. محمد الحضري  •  مدرسة ظفار للبنين</text></svg>